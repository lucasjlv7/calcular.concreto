<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dosagem Concreto - UFRN</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 font-sans">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-6">
        <h1 class="text-xl font-bold text-blue-800 border-b-2 border-blue-800 mb-4 pb-2">Dosagem de Concreto</h1>
        
        <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-xs font-bold text-gray-600">fck (MPa)</label>
                <input type="number" id="fck" value="40" class="w-full p-2 border rounded">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600">Umidade Areia (%)</label>
                <input type="number" id="h" value="3" class="w-full p-2 border rounded">
            </div>
        </div>

        <div class="space-y-4">
            <button onclick="calcularDosagem()" class="w-full bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md">CALCULAR EXERCÃCIO</button>
            
            <div id="resultados" class="hidden space-y-2 text-sm">
                <div class="p-3 bg-yellow-50 rounded border border-yellow-200">
                    <p><strong>1) fc28:</strong> <span id="res_fc28"></span> MPa</p>
                    <p><strong>3) x (a/c):</strong> <span id="res_x"></span></p>
                    <p><strong>4) Cimento (c):</strong> <span id="res_c"></span> kg</p>
                </div>

                <div class="p-3 bg-blue-50 rounded border border-blue-200">
                    <h3 class="font-bold text-blue-800 mb-1">Teores em Massa /mÂ³</h3>
                    <p>Cimento: <span id="m_c"></span> kg</p>
                    <p>Areia Ãmida (Mh1'): <span id="m_a"></span> kg</p>
                    <p>Brita (M2'): <span id="m_b"></span> kg</p>
                    <p>Ãgua Corrigida (a'): <span id="m_agua"></span> L</p>
                </div>

                <div class="p-3 bg-green-50 rounded border border-green-200">
                    <h3 class="font-bold text-green-800 mb-1">Padiola (30 x 27.5 cm)</h3>
                    <p class="text-xs italic mb-2">*Baseado em 1 saco de cimento</p>
                    <div id="padiola_detalhe"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calcularDosagem() {
            // Dados de entrada baseados no seu ExercÃ­cio 1
            const fck = parseFloat(document.getElementById('fck').value);
            const sd = 5.5; // Controle "B" do PDF
            const h = parseFloat(document.getElementById('h').value) / 100;
            const agua_tab = 203; // Conforme ExercÃ­cio 1 (Dmax 19, Y 100)
            
            // 1. fc28
            const fc28 = fck + 1.65 * sd;
            
            // 3. RelaÃ§Ã£o a/c (x) - Simplificado conforme ExercÃ­cio 1
            // No exercÃ­cio deu 0.41 (provavelmente limitado por durabilidade/classe)
            const x = 0.41; 
            
            // 4. Teor de cimento
            const c = agua_tab / x;
            
            // Dados fixos do ExercÃ­cio 1 para o exemplo
            const m_h1_linha = 548.53; // Areia Ãºmida corrigida
            const m_2_linha = 1163.08; // Brita corrigida
            const a_linha = 187.02;    // Ãgua corrigida
            
            // 12. Padiolas (Ref: 1 saco cimento = 35L)
            // Volumes de exemplo do seu PDF
            const vol_areia = 37.10; 
            const vol_brita = 69.30;
            
            // CÃ¡lculo do comprimento: L = Vol / (30 * 27.5) * 1000 para converter L em cm
            const L_areia = (vol_areia / (30 * 27.5)) * 1000;
            const L_brita = (vol_brita / (30 * 27.5)) * 1000;

            // Mostrar Resultados
            document.getElementById('res_fc28').innerText = fc28.toFixed(2);
            document.getElementById('res_x').innerText = x;
            document.getElementById('res_c').innerText = c.toFixed(2);
            document.getElementById('m_c').innerText = c.toFixed(2);
            document.getElementById('m_a').innerText = m_h1_linha.toFixed(2);
            document.getElementById('m_b').innerText = m_2_linha.toFixed(2);
            document.getElementById('m_agua').innerText = a_linha.toFixed(2);
            
            document.getElementById('padiola_detalhe').innerHTML = `
                <p><strong>Areia:</strong> ${vol_areia} L</p>
                <p class="ml-2">2 viag. de <strong>${(L_areia/2).toFixed(2)} cm</strong></p>
                <p class="mt-2"><strong>Brita:</strong> ${vol_brita} L</p>
                <p class="ml-2">3 viag. de <strong>${(L_brita/3).toFixed(2)} cm</strong></p>
            `;
            
            document.getElementById('resultados').classList.remove('hidden');
        }
    </script>
</body>
</html>
